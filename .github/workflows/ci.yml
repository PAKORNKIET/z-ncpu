# CI ฟรีบน GitHub Actions (public repo ใช้ runner มาตรฐานได้ไม่จำกัด) — Spec ส่วน 2 และ 17
name: CI

on:
  push:
    branches: [main]
  pull_request:

# สิทธิ์ต่ำสุดที่จำเป็น: อ่านโค้ดอย่างเดียว
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      # E2E: เปิดเว็บจริงใน Chromium ทั้งตอน dev (StrictMode) และตัว build
      - name: ติดตั้ง Chromium สำหรับ Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E
        run: pnpm exec playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
