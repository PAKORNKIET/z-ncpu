[package]
name = "z-ncpu-desktop"
version = "0.1.0"
license = "MIT"
authors = ["Pakornkiet Puanpanwong"]
description = "Z-NCPU — สร้าง CPU จากเกต NAND (Windows)"
edition = "2021"
publish = false

[lib]
name = "z_ncpu_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
